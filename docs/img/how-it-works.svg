<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="20" fill="#0f172a"/>

  <text x="40" y="54" font-size="22" font-weight="700" fill="#f8fafc">Что происходит, когда VPN отваливается</text>
  <text x="40" y="80" font-size="14" fill="#94a3b8">Пример: вы работаете в Claude через VPN в Нидерландах</text>

  <!-- 1. всё в порядке -->
  <rect x="40" y="120" width="240" height="220" rx="16" fill="#1e293b" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="66" cy="148" r="12" fill="#16a34a"/>
  <text x="66" y="153" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="88" y="154" font-size="17" font-weight="700" fill="#f1f5f9">Всё в порядке</text>
  <rect x="58" y="176" width="204" height="34" rx="17" fill="#0f172a"/>
  <circle cx="78" cy="193" r="6" fill="#16a34a"/>
  <text x="92" y="198" font-size="14" fill="#e2e8f0">🇳🇱 203.0.113.42</text>
  <g font-size="13.5" fill="#94a3b8">
    <text x="58" y="242">VPN включён, IP разрешён.</text>
    <text x="58" y="264">Claude работает как обычно,</text>
    <text x="58" y="286">Kordon просто следит</text>
    <text x="58" y="308">за сетью.</text>
  </g>

  <!-- arrow 1 -->
  <path d="M286 230 H364" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="325" y="218" font-size="11.5" fill="#cbd5e1" text-anchor="middle">VPN упал</text>

  <!-- 2. заморожено -->
  <rect x="370" y="120" width="240" height="220" rx="16" fill="#1e293b" stroke="#ea8a00" stroke-width="1.5"/>
  <circle cx="396" cy="148" r="12" fill="#ea8a00"/>
  <text x="396" y="153" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="418" y="154" font-size="17" font-weight="700" fill="#f1f5f9">Заморожено</text>
  <rect x="388" y="176" width="204" height="34" rx="17" fill="#0f172a"/>
  <circle cx="408" cy="193" r="6" fill="#ea8a00"/>
  <text x="422" y="198" font-size="14" fill="#e2e8f0">🇷🇺 95.24.1.1 · 20 с</text>
  <g font-size="13.5" fill="#94a3b8">
    <text x="388" y="242">За полсекунды Kordon ставит</text>
    <text x="388" y="264">Claude на паузу. Пока IP</text>
    <text x="388" y="286">не тот, программа стоит</text>
    <text x="388" y="308">и ничего не отправляет.</text>
  </g>

  <!-- branch arrows -->
  <path d="M616 210 C650 210 650 150 684 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M616 250 C650 250 650 310 684 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3a. вернулся -->
  <rect x="690" y="96" width="230" height="114" rx="16" fill="#1e293b" stroke="#16a34a" stroke-width="1.5"/>
  <text x="710" y="122" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="0.6">VPN ВЕРНУЛСЯ ЗА 20 С</text>
  <text x="710" y="148" font-size="17" font-weight="700" fill="#f1f5f9">Всё продолжается</text>
  <g font-size="13.5" fill="#94a3b8">
    <text x="710" y="172">С того же места, ничего</text>
    <text x="710" y="192">не потеряно и не закрыто.</text>
  </g>

  <!-- 3b. не вернулся -->
  <rect x="690" y="250" width="230" height="114" rx="16" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
  <text x="710" y="276" font-size="11" font-weight="700" fill="#f87171" letter-spacing="0.6">НЕ ВЕРНУЛСЯ</text>
  <text x="710" y="302" font-size="17" font-weight="700" fill="#f1f5f9">Claude закрыт</text>
  <g font-size="13.5" fill="#94a3b8">
    <text x="710" y="326">И не запустится, пока снова</text>
    <text x="710" y="346">не будет разрешённого IP.</text>
  </g>

  <text x="40" y="404" font-size="13" fill="#64748b">Остальные программы и интернет работают как обычно. Разрешить можно IP, подсети или целые страны.</text>
</svg>
